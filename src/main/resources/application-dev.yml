spring:

  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:taco_cloud;DB_CLOSE_DELAY=-1
    generate-unique-name: false
    username: sa
    password:

  h2:
    console:
      enabled: true

logging:
  file:
    name: D:\tmp\logs\taco-cloud-dev.log

  level:
    tacos: DEBUG
    com.zaxxer.hikari.HikariConfig: DEBUG
    com.zaxxer.hikari: TRACE

taco:
  orders:
    pageSize: 5