spring:

  datasource:
    driver-class-name: org.mariadb.jdbc.Driver
    url: jdbc:mariadb://localhost:3306/tacocloud
    username: root
    password: ${MARIADB_ROOT_PWD:s2cRet}

  jpa:
    show-sql: false
    hibernate:
      ddl-auto: update

logging:
  file:
    name: D:\tmp\logs\taco-cloud-prod.log

  level:
    tacos: WARN
    com.zaxxer.hikari.HikariConfig: WARN
    com.zaxxer.hikari: WARN
