spring:
  application:
    name: taco-cloud

  datasource:
    driver-class-name: org.mariadb.jdbc.Driver
    url: jdbc:mariadb://localhost:3306/tacocloud
    username: root
    password: ${MARIADB_ROOT_PWD:s2cRet}

  jpa:
    show-sql: true
    hibernate:
      ddl-auto: update

  security:
    oauth2:
      client:
        registration:
          facebook:
            clientId: ${CLIENT_ID_FACEBOOK:518366633951705}
            clientSecret: ${CLIENT_SECRET_FACEBOOK:651196dfafa2123d14c09ee25e4c991a}
            scope: email, public_profile    
          github:
            clientId: ${CLIENT_ID_GITHUB:Ov23liCBLLUjii41pS7k}
            clientSecret: ${CLIENT_SECRET_GITHUB:9da8734b56aad52d91b268fe6834a8df12447d95}
            scope: email, public_profile    
          google:
            clientId: ${CLIENT_ID_GOOGLE:Ov23liCBLLUjii41pS7k}
            clientSecret: ${CLIENT_SECRET_GOOGLE:9da8734b56aad52d91b268fe6834a8df12447d95}
            scope: email, openid
          naver:
            clientId: ${CLIENT_ID_NAVER:518366633951705}
            clientSecret: ${CLIENT_SECRET_NAVER:651196dfafa2123d14c09ee25e4c991a}
            scope: email, name
            clientName: Naver
            authorizationGrantType: authorization_code
            redirectUri: http://localhost:8080/login/oauth2/code/naver
          kakao:
            client-id: ${CLIENT_ID_KAKAO:518366633951705}
            client-secret: ${CLIENT_SECRET_KAKAO:651196dfafa2123d14c09ee25e4c991a}
            client-authentication-method: client_secret_post
            redirect-uri: http://localhost:8080/login/oauth2/code/kakao
            authorization-grant-type: authorization_code
            client-name: kakao
            scope: profile_nickname, account_email
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id
          naver:
            authorizationUri: https://nid.naver.com/oauth2.0/authorize
            tokenUri: https://nid.naver.com/oauth2.0/token
            userInfoUri: https://openapi.naver.com/v1/nid/me
            userNameAttribute: response

logging:
  file:
    name: D:\tmp\logs\taco-cloud-prod.log

  pattern:
    console: ${LOG_PATTERN_CONSOLE:%green(%d{HH:mm:ss:SSS}) %blue(%-5level) %red([%thread]) %yellow(%logger{15}) - %msg%n}

  level:
    com.zaxxer.hikari.HikariConfig: WARN
    com.zaxxer.hikari: WARN

taco:
  orders:
    pageSize: 3